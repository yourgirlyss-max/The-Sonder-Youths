.hero::after{content:"";position:absolute;inset:auto 0 0 0;height:40%;background:linear-gradient(transparent,var(--bg))}
main{max-width:560px;margin:-60px auto 0;padding:0 20px 56px;position:relative;z-index:1;text-align:center}
h1{font-size:clamp(2.2rem,8vw,3.4rem);letter-spacing:.04em;margin:0 0 6px;text-transform:uppercase;font-weight:400}
.tag{margin:0 0 28px;color:var(--accent);font-style:italic}
.links{display:grid;gap:12px}
.links a{display:block;padding:15px 18px;border:1px solid var(--line);background:var(--card);backdrop-filter:blur(6px);color:var(--ink);text-decoration:none;border-radius:999px;font-family:system-ui,sans-serif;font-size:1rem;letter-spacing:.06em;transition:.2s}
.links a:hover,.links a:focus-visible{background:var(--hover);color:var(--hoverink);transform:translateY(-2px)}
footer{margin-top:40px;font-size:.85rem;opacity:.7;font-family:system-ui,sans-serif}

.cloud{position:absolute;left:-480px;width:420px;height:120px;border-radius:60px;background:radial-gradient(ellipse 35% 70% at 25% 55%,#fff 0,transparent 100%),radial-gradient(ellipse 40% 90% at 55% 45%,#fff 0,transparent 100%),radial-gradient(ellipse 30% 60% at 80% 60%,#fff 0,transparent 100%);filter:blur(10px);opacity:.75;animation:drift linear infinite;pointer-events:none}
.c1{top:8%;animation-duration:70s}.c2{top:30%;transform:scale(1.4);animation-duration:95s;animation-delay:-40s;opacity:.55}.c3{top:55%;animation-duration:80s;animation-delay:-20s;opacity:.65}.c4{top:18%;transform:scale(.7);animation-duration:55s;animation-delay:-10s;opacity:.5}
@keyframes drift{to{left:110%}}
@media (prefers-reduced-motion:reduce){.cloud{animation:none;left:10%}}
.hero{overflow:hidden}
h2{font-weight:400;letter-spacing:.08em;text-transform:uppercase;font-size:1.2rem;margin:48px 0 16px}
#composer{display:none;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:18px;padding:14px;margin-bottom:20px;font-family:system-ui,sans-serif}
#composer textarea{width:100%;min-height:80px;border:0;background:transparent;color:var(--ink);font:inherit;resize:vertical;outline:none}
#composer .row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
#composer button,.del{font:inherit;border:1px solid var(--line);background:var(--ink);color:var(--bg);border-radius:999px;padding:8px 18px;cursor:pointer}
#composer button:disabled{opacity:.5}
.post{text-align:left;border:1px solid var(--line);background:var(--card);border-radius:18px;padding:16px;margin-bottom:14px;font-family:system-ui,sans-serif}
.post img{width:100%;border-radius:12px;display:block;margin-bottom:10px}
.post p{margin:0 0 8px;white-space:pre-wrap;overflow-wrap:anywhere}
.post time{font-size:.8rem;opacity:.65}
.del{background:transparent;color:var(--ink);padding:3px 12px;font-size:.8rem;margin-left:10px}
.empty{opacity:.65;font-style:italic}
#admin{margin-top:36px;font-family:system-ui,sans-serif;font-size:.85rem}
#admin summary{cursor:pointer;opacity:.6;letter-spacing:.1em;text-transform:uppercase}
#admin[open] summary{margin-bottom:14px}
#gate{display:flex;gap:8px;margin-bottom:12px}
.links[hidden]{display:none}#socials{margin-top:12px}
.soc{display:block;width:100%;padding:15px 18px;border:1px solid var(--line);background:var(--card);backdrop-filter:blur(6px);color:var(--ink);border-radius:999px;font-family:system-ui,sans-serif;font-size:1rem;letter-spacing:.06em;cursor:pointer;transition:.2s}
.soc:hover,.soc:focus-visible{background:var(--hover);color:var(--hoverink)}
.soc{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);left:14px;z-index:5;width:auto;padding:6px 4px;border:0;background:none;backdrop-filter:none;color:#fff;opacity:.8;text-shadow:0 0 8px rgba(0,0,0,.35);font-size:.85rem;letter-spacing:.14em;text-transform:uppercase}
.soc:hover,.soc:focus-visible{background:none;color:#fff;opacity:1}
#socials{position:absolute;top:calc(env(safe-area-inset-top,0px) + 48px);left:14px;z-index:5;width:min(220px,calc(100vw - 28px));margin:0;padding:10px;border-radius:18px;background:var(--card);backdrop-filter:blur(10px);border:1px solid var(--line);gap:8px}
#socials a{padding:10px 14px;font-size:.9rem}
#sublinks{display:grid;gap:8px}#sublinks[hidden]{display:none}
.subbtn{display:block;width:100%;padding:10px 14px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;font-family:system-ui,sans-serif;font-size:.9rem;letter-spacing:.06em;cursor:pointer;text-align:center;transition:.2s}
.subbtn:hover,.subbtn:focus-visible{background:var(--hover);color:var(--hoverink)}
#allbtn{display:block;margin:6px auto 0;padding:10px 22px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;font-family:system-ui,sans-serif;letter-spacing:.06em;cursor:pointer}
#allbtn[hidden],#allwin[hidden]{display:none}
#allwin{position:fixed;inset:0;z-index:20;background:rgba(5,10,20,.55);backdrop-filter:blur(6px);display:flex;align-items:flex-start;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 16px) 14px calc(env(safe-area-inset-bottom,0px) + 16px)}
.awin{width:100%;max-width:560px;max-height:100%;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:22px;overflow:hidden}
.ahead{display:flex;justify-content:space-between;align-items:center;padding:12px 16px 12px 20px;border-bottom:1px solid var(--line);font-family:system-ui,sans-serif;letter-spacing:.1em;text-transform:uppercase;font-size:.85rem}
.ahead button{font:inherit;letter-spacing:.06em;text-transform:none;padding:6px 16px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;cursor:pointer}
#allfeed{overflow-y:auto;padding:16px}
#allbtn{text-decoration:none;width:fit-content}
#allwin{position:static;inset:auto;background:none;backdrop-filter:none;display:block;z-index:auto;padding:calc(env(safe-area-inset-top,0px) + 16px) 20px 48px}
.awin{max-width:560px;margin:0 auto;border:0;border-radius:0;background:none;display:block;overflow:visible}
.ahead{border:0;padding:44px 0 20px;justify-content:flex-start;gap:18px}
.ahead a{color:var(--ink);text-decoration:none;opacity:.75;font-size:.85rem;letter-spacing:.06em;text-transform:none}
#allfeed{overflow:visible;padding:0}
#vipbtn{display:block;width:fit-content;margin:0 auto 18px;padding:9px 26px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;font-family:system-ui,sans-serif;letter-spacing:.2em;text-decoration:none;font-size:.85rem}
#vipbtn:hover{background:var(--hover);color:var(--hoverink)}
#vipwin{padding:calc(env(safe-area-inset-top,0px) + 16px) 20px 48px}
#vipwin[hidden]{display:none}
#vipgate{display:flex;gap:8px;margin-bottom:12px;font-family:system-ui,sans-serif}
#vipgate input,#composer input[type=password]{flex:1;min-width:0;width:100%;padding:8px 14px;border:1px solid var(--line);border-radius:12px;background:transparent;color:var(--ink);font:inherit}
#composer input[type=password]{margin-bottom:8px}
.mrow span{white-space:normal;overflow:visible;text-overflow:clip;overflow-wrap:anywhere}
#gate .eye,#vipgate .eye{background:transparent;color:var(--ink);padding:8px 14px}
#vipgate button{font:inherit;border:1px solid var(--line);background:var(--ink);color:var(--bg);border-radius:999px;padding:8px 18px;cursor:pointer}
body.pv .hero,body.pv main{display:none}
.soc{padding:9px 20px;border:1px solid rgba(255,255,255,.45);background:rgba(10,20,40,.38);backdrop-filter:blur(8px);border-radius:999px;opacity:1;text-shadow:none;color:#fff;font-size:.8rem}
.soc:hover,.soc:focus-visible{background:rgba(10,20,40,.6);color:#fff}
.soc,#theme,#socials{transition:opacity .3s,transform .3s,background .2s}
body.scrolled .soc,body.scrolled #theme,body.scrolled #socials{opacity:0;transform:translateY(-14px);pointer-events:none}
.sep{border:0;border-top:1px solid var(--line);margin:14px 0}.sub{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;opacity:.7;margin-bottom:8px}
#composer input[type=text],#composer input[type=datetime-local]{width:100%;margin-bottom:8px;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:transparent;color:var(--ink);font:inherit}
.mrow{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)}.mrow span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
#album{display:none;margin-top:8px}#cd{display:flex;gap:10px;justify-content:center;font-family:system-ui,sans-serif}.u{min-width:64px;padding:10px 6px;border:1px solid var(--line);background:var(--card);border-radius:14px}.u b{display:block;font-size:1.6rem;font-weight:600;font-variant-numeric:tabular-nums}.u small{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;opacity:.7}
#gate input{flex:1;min-width:0;padding:8px 14px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);font:inherit}
#gate button{font:inherit;border:1px solid var(--line);background:var(--ink);color:var(--bg);border-radius:999px;padding:8px 18px;cursor:pointer}
.hero::before{content:"";position:absolute;inset:0;background:inherit;filter:var(--hf);transition:filter .6s}

<script>window.SY=JSON.parse(document.getElementById("sy-data").textContent)</script>
<script>
(()=>{
const $=id=>document.getElementById(id);
const fmt=ts=>new Date(ts).toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'});
function postEl(p){
 const el=document.createElement('div');el.className='post';
 if(p.img){const i=document.createElement('img');i.src=p.img;i.alt='';el.appendChild(i)}
 if(p.text){const x=document.createElement('p');x.textContent=p.text;el.appendChild(x)}
 const tm=document.createElement('time');tm.textContent=fmt(p.ts);el.appendChild(tm);
 return el;
}
let lastSig=null;
async function loadPosts(){
 try{
  let list=(window.SY&&SY.posts)||[];
  try{const r=await fetch('/api/posts',{cache:'no-store'});if(r.ok)list=await r.json()}catch(e){}
  const sig=JSON.stringify(list);if(sig===lastSig)return;lastSig=sig;
  window.SY.posts=list;
  const feed=$('feed'),af=$('allfeed');
  feed.textContent='';af.textContent='';
  if(!list.length){feed.innerHTML='<p class="empty">Nothing posted yet.</p>';$('allbtn').hidden=true;return}
  $('allbtn').hidden=list.length<2;
  list.forEach((p,i)=>{if(i===0)feed.appendChild(postEl(p));af.appendChild(postEl(p))});
 }catch(e){console.error(e)}
}
window.syReload=loadPosts;
setInterval(()=>{if(!document.hidden)loadPosts()},15000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)loadPosts()});
let cur=null,tick=null;
const cd=$('cd'),alb=$('album');
function draw(){
 if(!cur||!cur.at){alb.style.display='none';return}
 alb.style.display='block';$('atl').textContent=cur.title||'Next album';
 const ms=cur.at-Date.now();
 if(ms<=0){cd.innerHTML='<p>Out now 🌙</p>';return}
 const s=Math.floor(ms/1000),v=[[Math.floor(s/86400),'days'],[Math.floor(s%86400/3600),'hours'],[Math.floor(s%3600/60),'min'],[s%60,'sec']];
 cd.innerHTML=v.map(x=>'<div class="u"><b>'+String(x[0]).padStart(2,'0')+'</b><small>'+x[1]+'</small></div>').join('');
}
async function loadAlbum(){
 try{cur=(window.SY&&SY.album)||null;draw();clearInterval(tick);if(cur&&cur.at)tick=setInterval(draw,1000)}catch(e){console.error(e)}
}
loadPosts();loadAlbum();
})();
</script>
<script>
(function(){var r=document.documentElement,b=document.getElementById('theme');
function dark(){return r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches}
function paint(){b.textContent=dark()?'☀︎':'☾︎'}
try{var s=localStorage.getItem('theme');if(s)r.dataset.theme=s}catch(e){}
paint();
b.onclick=function(){var n=dark()?'light':'dark';r.dataset.theme=n;try{localStorage.setItem('theme',n)}catch(e){}paint()};
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',paint);
document.querySelectorAll('.eye').forEach(function(b){b.onclick=function(){var i=document.getElementById(b.dataset.for),s=i.type==='password';i.type=s?'text':'password';b.textContent=s?'Hide':'Show'}});
var sb=document.getElementById('socbtn'),sn=document.getElementById('socials');sb.onclick=function(){var o=sn.hidden;sn.hidden=!o;sb.setAttribute('aria-expanded',o);sb.textContent=o?'Close':'More'};
var ss=document.getElementById('socsub'),sl=document.getElementById('sublinks');ss.onclick=function(){sl.hidden=!sl.hidden;ss.setAttribute('aria-expanded',!sl.hidden)};
function closeMore(){if(!sn.hidden){sn.hidden=true;sb.setAttribute('aria-expanded',false);sb.textContent='More'}}
document.addEventListener('click',function(e){if(!sn.hidden&&!sn.contains(e.target)&&!sb.contains(e.target))closeMore()});
addEventListener('keydown',function(e){if(e.key==='Escape')closeMore()});addEventListener('blur',closeMore);
var ly=0;addEventListener('scroll',function(){var y=scrollY;if(y>60){document.body.classList.add('scrolled');if(!sn.hidden){sn.hidden=true;sb.setAttribute('aria-expanded',false);sb.textContent='More'}}else{document.body.classList.remove('scrolled')}ly=y},{passive:true});
var aw=document.getElementById('allwin');function route(){var p=location.hash==='#posts';document.body.classList.toggle('pv',p);aw.hidden=!p;if(p)scrollTo(0,0)}addEventListener('hashchange',route);route();

})();
</script>

<script>
(function(){
const $=id=>document.getElementById(id);
let pw='',posts=[],busy=false;
try{pw=sessionStorage.getItem('sy_pw')||''}catch(e){}
function say(id,t,ok){const e=$(id);e.textContent=t||'';e.className='m'+(t?(ok?' o':' e'):'')}
async function api(method,payload){
 const r=await fetch('/api/posts',{method,headers:{'content-type':'application/json'},body:JSON.stringify(Object.assign({password:pw},payload))});
 const d=await r.json().catch(()=>({}));
 if(!r.ok){const e=new Error(d.error||('Error '+r.status));e.status=r.status;throw e}
 return d;
}
function show(p){$('am-login').hidden=p;$('am-panel').hidden=!p;if(p)loadList()}
function close(){$('am').hidden=true}
async function loadList(){try{posts=await (await fetch('/api/posts',{cache:'no-store'})).json()}catch(e){posts=[]}renderList()}
function renderList(){
 const box=$('am-list');box.textContent='';
 if(!posts.length){box.textContent='No posts yet.';return}
 posts.forEach(p=>{
  const it=document.createElement('div');it.className='it';
  const sp=document.createElement('span');sp.textContent=p.text||'(photo)';
  const b=document.createElement('button');b.className='g';b.textContent='Delete';
  b.onclick=async()=>{
   if(b.dataset.a!=='1'){b.dataset.a='1';b.textContent='Tap again';setTimeout(()=>{b.dataset.a='';b.textContent='Delete'},4000);return}
   try{posts=await api('DELETE',{id:p.id});renderList();say('am-pm','Deleted.',true);window.syReload&&syReload()}catch(e){say('am-pm',e.message)}
  };
  it.append(sp,b);box.appendChild(it);
 });
}
$('adminopen').onclick=e=>{e.preventDefault();$('am').hidden=false;if(pw){api('POST',{check:true}).then(()=>show(true)).catch(()=>show(false))}else show(false)};
$('am-x1').onclick=close;$('am-x2').onclick=close;
$('am').addEventListener('click',e=>{if(e.target===$('am'))close()});
$('am-go').onclick=async()=>{
 const v=$('am-pw').value;if(!v)return;pw=v;
 try{await api('POST',{check:true});try{sessionStorage.setItem('sy_pw',pw)}catch(e){}$('am-pw').value='';say('am-lm','');show(true)}
 catch(e){pw='';say('am-lm',e.status===401?'Wrong password':e.message)}
};
$('am-pw').addEventListener('keydown',e=>{if(e.key==='Enter')$('am-go').click()});
$('am-post').onclick=async()=>{
 const text=$('am-txt').value.trim();if(!text){say('am-pm','Write something first');return}
 if(busy)return;busy=true;say('am-pm','Posting…',true);
 try{posts=await api('POST',{text});$('am-txt').value='';renderList();say('am-pm','Posted. The site updates by itself.',true);window.syReload&&syReload()}
 catch(e){say('am-pm',e.message)}
 busy=false;
};
})();
</script>
